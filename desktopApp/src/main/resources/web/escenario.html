<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest-escenario.json">
<meta name="apple-mobile-web-app-title" content="Escenario">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon.png">
<title>Selah · Escenario</title>
<style>
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:#000; color:#fff; font-family:system-ui, -apple-system, Roboto, sans-serif; overflow:hidden; }
  body { display:flex; flex-direction:column; padding:2vh 3vw; gap:1.5vh; }
  #top { display:flex; align-items:baseline; gap:2vw; color:#aaa; font-size:3vh; }
  #title { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #section { color:#ffd54f; font-weight:600; }
  #clock { font-variant-numeric:tabular-nums; color:#fff; font-size:4.5vh; font-weight:600; }
  #badge { display:none; background:#c62828; color:#fff; padding:0 1vw; border-radius:6px; font-size:2.6vh; }
  #msg { display:none; background:#ffd54f; color:#000; font-size:5vh; font-weight:700; text-align:center; padding:1vh 2vw; border-radius:10px; }
  #current { flex:3; display:flex; align-items:center; justify-content:center; text-align:center; white-space:pre-line; font-weight:600; line-height:1.2; }
  #next { flex:1.4; display:flex; align-items:center; justify-content:center; text-align:center; white-space:pre-line; color:#8a8a8a; border-top:2px solid #333; line-height:1.2; }
  .pres { max-width:100%; max-height:100%; object-fit:contain; }
  #nextLbl { color:#555; font-size:2.4vh; text-transform:uppercase; letter-spacing:.1em; }
  #cd { display:none; text-align:center; font-size:12vh; font-weight:700; font-variant-numeric:tabular-nums; color:#80deea; }
  #alert { display:none; background:#b71c1c; color:#fff; font-size:3.5vh; text-align:center; padding:.6vh 1vw; border-radius:8px; }
  #timer { display:none; align-items:baseline; justify-content:center; gap:3vw; font-variant-numeric:tabular-nums; font-weight:700; }
  #timer .big { font-size:11vh; }
  #timer .small { font-size:4vh; color:#aaa; font-weight:600; }
  #timer.warn .big { color:#ffd54f; }
  #timer.over .big { color:#ff5252; }
  #chordBar { display:none; gap:.6vw; align-items:center; }
  #chordBar button { background:#222; color:#ddd; border:1px solid #444; border-radius:8px; font-size:2.4vh; padding:.3vh .8vw; }
  #chordBar button.on { background:#ffd54f; color:#000; border-color:#ffd54f; }
  #key { color:#ffd54f; font-size:2.4vh; min-width:3vw; text-align:center; }
  .ln { display:block; white-space:nowrap; }
  .seg { display:inline-block; vertical-align:bottom; white-space:pre; }
  .ch { display:block; color:#ffd54f; font-size:.62em; font-weight:700; line-height:1.15; min-height:1.15em; }
  #status { position:fixed; right:1vw; bottom:1vh; color:#c62828; font-size:2vh; }
  /* Click de los músicos: pulso visual (más fuerte en el 1) y sonido opcional con audífonos */
  #clickBar { display:none; align-items:center; gap:1.5vw; font-size:3vh; color:#ccc; }
  #pulse { width:4vh; height:4vh; border-radius:50%; background:#4f378b; opacity:.2; }
  #beatTxt { font-variant-numeric:tabular-nums; min-width:22vw; }
  #clickSound { background:#222; color:#ddd; border:1px solid #444; border-radius:8px; font-size:2.4vh; padding:.3vh .8vw; }
  #clickSound.on { background:#80deea; color:#000; border-color:#80deea; }
</style>
</head>
<body>
<div id="top"><span id="title"></span><span id="section"></span>
  <span id="chordBar"><button id="chordsBtn">Acordes</button><button id="down">♭</button><span id="key"></span><button id="up">♯</button></span>
  <span id="badge">NEGRO</span><span id="clock"></span></div>
<div id="clickBar"><span id="pulse"></span><span id="beatTxt"></span><span id="bpmTxt"></span>
  <button id="clickSound">🎧 Escuchar el click</button></div>
<div id="msg"></div>
<div id="alert"></div>
<div id="cd"></div>
<div id="timer"><span class="small" id="timerLbl"></span><span class="big" id="timerBig"></span><span class="small" id="timerSub"></span></div>
<div id="current"></div>
<div id="nextLbl">Sigue</div>
<div id="next"></div>
<div id="status"></div>
<script src="selah.js"></script>
<script>
"use strict";
const P = Selah, S = P.S, $ = (id) => document.getElementById(id);

// Ajusta el tamaño de letra para que el texto quepa en su caja.
function fit(box, maxVh) {
  let size = maxVh;
  box.style.fontSize = size + "vh";
  while (size > 2 && (box.scrollHeight > box.clientHeight || box.scrollWidth > box.clientWidth)) {
    size -= 0.5; box.style.fontSize = size + "vh";
  }
}

// --- Acordes (para los músicos): "[G]Cuán grande es [C]Él" → el acorde arriba de la sílaba, y transponer ---
const store = { get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } },
                set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
let showChords = store.get("acordes") === "1";
const transpose = {}; // semitonos por canción (songId)
const NOTES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
const FLAT = { Db: "C#", Eb: "D#", Gb: "F#", Ab: "G#", Bb: "A#", Cb: "B", Fb: "E" };
function moveNote(n, k) {
  const i = NOTES.indexOf(FLAT[n] || n);
  return i < 0 ? n : NOTES[((i + k) % 12 + 12) % 12];
}
function transposeChord(ch, k) {
  if (!k) return ch;
  return ch.replace(/^([A-G][#b]?)/, (m) => moveNote(m, k)).replace(/\/([A-G][#b]?)/, (m, b) => "/" + moveNote(b, k));
}
const esc = (t) => t.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
function chordHtml(text, k) {
  return '<div>' + text.split("\n").map((line) => {
    const parts = line.split(/\[([A-G][^\]\s]{0,11})\]/);
    let html = parts[0] ? '<span class="seg"><span class="ch"></span>' + esc(parts[0]) + "</span>" : "";
    for (let i = 1; i < parts.length; i += 2) {
      html += '<span class="seg"><span class="ch">' + esc(transposeChord(parts[i], k)) + " </span>" + (esc(parts[i + 1] || "") || "&nbsp;") + "</span>";
    }
    return '<span class="ln">' + html + "</span>";
  }).join("") + "</div>";
}
function songKey(st) {
  const first = st.slides.map((s) => s.chords).find((c) => c);
  const m = first && first.match(/\[([A-G][#b]?m?)/);
  return m ? transposeChord(m[1], transpose[st.songId] || 0) : "";
}
$("chordsBtn").onclick = () => { showChords = !showChords; store.set("acordes", showChords ? "1" : "0"); render(); };
$("up").onclick = () => { const id = S.state.songId; transpose[id] = (transpose[id] || 0) + 1; render(); };
$("down").onclick = () => { const id = S.state.songId; transpose[id] = (transpose[id] || 0) - 1; render(); };
function setSlide(box, slide) {
  // Presentación: la diapositiva misma (la actual grande, la siguiente en miniatura)
  const st = S.state;
  if (st.presentation && slide) {
    const i = st.slides.indexOf(slide);
    const src = "/diapositiva?" + (box.id === "next" ? "mini=1&" : "") + "n=" + i + "&nombre=" + encodeURIComponent(st.presentation);
    const old = box.querySelector("img.pres");
    if (old && old.getAttribute("src") === src) return;
    const img = document.createElement("img"); img.className = "pres"; img.src = src; img.alt = slide.text;
    box.replaceChildren(img);
    return;
  }
  if (showChords && slide && slide.chords) box.innerHTML = chordHtml(slide.chords, transpose[S.state.songId] || 0);
  else box.textContent = slide ? slide.text : "";
}

function render() {
  const st = S.state;
  const cur = st.slides[st.index];
  const next = st.slides[st.index + 1];
  const hasChords = st.slides.some((s) => s.chords);
  $("chordBar").style.display = hasChords ? "inline-flex" : "none";
  $("chordsBtn").classList.toggle("on", showChords);
  $("down").style.display = $("up").style.display = showChords ? "" : "none";
  $("key").textContent = showChords ? songKey(st) : "";
  $("title").textContent = st.title || "";
  const sec = P.sections(st)[P.currentSection(st)];
  $("section").textContent = st.isBible ? (cur ? cur.label : "") : (sec ? sec.label : "");
  $("badge").style.display = st.blank ? "inline" : "none";
  setSlide($("current"), cur);
  setSlide($("next"), next);
  $("nextLbl").style.visibility = next ? "visible" : "hidden";
  $("msg").textContent = st.stageMessage || "";
  $("msg").style.display = st.stageMessage ? "block" : "none";
  $("alert").textContent = st.alert ? "Alerta en pantalla: " + st.alert : "";
  $("alert").style.display = st.alert ? "block" : "none";
  renderCountdown();
  renderTimer();
  fit($("current"), 9);
  fit($("next"), 5);
}

function renderCountdown() {
  const left = P.countdownSeconds(S.state);
  const on = left != null && left > 0;
  $("cd").style.display = on ? "block" : "none";
  if (on) $("cd").textContent = (S.state.countdownText ? S.state.countdownText + " " : "") + P.formatClock(left);
}

// Tiempo del predicador: grande lo que queda (o lo que lleva si no hay límite); amarillo los últimos 5 min, rojo al pasarse.
function renderTimer() {
  const st = S.state, box = $("timer");
  if (st.timerStart == null) { box.style.display = "none"; return; }
  const now = Date.now() + S.serverOffset;
  const elapsed = Math.max(0, Math.floor((now - st.timerStart) / 1000));
  box.style.display = "flex";
  if (st.timerMinutes > 0) {
    const left = st.timerMinutes * 60 - elapsed;
    box.className = left < 0 ? "over" : left <= 300 ? "warn" : "";
    $("timerLbl").textContent = left < 0 ? "Se pasó" : "Quedan";
    $("timerBig").textContent = (left < 0 ? "+" : "") + P.formatClock(Math.abs(left));
    $("timerSub").textContent = "lleva " + P.formatClock(elapsed);
  } else {
    box.className = "";
    $("timerLbl").textContent = "Lleva"; $("timerBig").textContent = P.formatClock(elapsed); $("timerSub").textContent = "";
  }
}

function tick() {
  renderCountdown();
  renderTimer();
  const d = new Date();
  $("clock").textContent = d.toLocaleTimeString("es", { hour: "2-digit", minute: "2-digit" });
}
setInterval(tick, 1000); tick();

// --- Click de los músicos ---
// Cada página calcula los tiempos con su reloj ajustado al del PC (S.serverOffset): no viaja audio por la red.
let audio = null, scheduled = new Set(), clickKey = "";
function clickBeat(c) { return (Date.now() + S.serverOffset - c.startAt) / (60000 / c.bpm); }
function frame() {
  const c = S.state.click;
  $("clickBar").style.display = c ? "flex" : "none";
  if (c) {
    const b = clickBeat(c), whole = Math.floor(b), phase = b - whole;
    const down = ((whole % c.beatsPerBar) + c.beatsPerBar) % c.beatsPerBar === 0;
    $("pulse").style.background = down ? "#ffd54f" : "#80deea";
    $("pulse").style.opacity = Math.max(0.15, 1 - phase * 3);
    $("beatTxt").textContent = whole < 0 ? "Cuenta " + (c.countIn + whole + 1)
      : "Compás " + (Math.floor(whole / c.beatsPerBar) + 1) + " · " + (((whole % c.beatsPerBar) + c.beatsPerBar) % c.beatsPerBar + 1);
    $("bpmTxt").textContent = "♩ " + c.bpm;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// Sonido (Web Audio): cada "toc" se programa con su hora exacta, con medio segundo de anticipación.
function scheduleClicks() {
  const c = S.state.click;
  if (!audio || !c) return;
  const key = c.startAt + "/" + c.bpm + "/" + c.beatsPerBar;
  if (key !== clickKey) { clickKey = key; scheduled = new Set(); }
  const beatMs = 60000 / c.bpm, nowServer = Date.now() + S.serverOffset;
  const latency = (audio.outputLatency || audio.baseLatency || 0);
  let beat = Math.max(-c.countIn, Math.ceil((nowServer + 20 - c.startAt) / beatMs));
  for (; c.startAt + beat * beatMs < nowServer + 600; beat++) {
    if (scheduled.has(beat)) continue;
    scheduled.add(beat);
    const when = audio.currentTime + (c.startAt + beat * beatMs - nowServer) / 1000 - latency;
    if (when < audio.currentTime) continue;
    const down = ((beat % c.beatsPerBar) + c.beatsPerBar) % c.beatsPerBar === 0;
    const osc = audio.createOscillator(), gain = audio.createGain();
    osc.frequency.value = down ? 1760 : 1175;
    gain.gain.setValueAtTime(down ? 0.9 : 0.7, when);
    gain.gain.exponentialRampToValueAtTime(0.001, when + 0.03);
    osc.connect(gain).connect(audio.destination);
    osc.start(when); osc.stop(when + 0.035);
  }
}
setInterval(scheduleClicks, 100);
$("clickSound").onclick = () => {
  // El navegador solo deja sonar después de un toque: aquí se crea el audio.
  if (audio) { audio.close(); audio = null; $("clickSound").classList.remove("on"); $("clickSound").textContent = "🎧 Escuchar el click"; return; }
  audio = new (window.AudioContext || window.webkitAudioContext)();
  clickKey = "";
  $("clickSound").classList.add("on"); $("clickSound").textContent = "🎧 Sonando (tocar para callar)";
};
window.addEventListener("resize", render);

P.on("state", render);
P.on("status", () => { $("status").textContent = S.connected ? "" : "Sin conexión con Selah…"; });
P.connect();
</script>
</body>
</html>
