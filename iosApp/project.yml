# Proyecto de Xcode para Selah Remoto en iPhone (iPad: más adelante).
# Se genera con XcodeGen (brew install xcodegen):   cd iosApp && xcodegen
# Luego abrir SelahRemoto.xcodeproj. Ver docs/IOS.md.
name: SelahRemoto
options:
  bundleIdPrefix: app.selah
  deploymentTarget:
    # 17: una pieza de Compose (libicu) viene hecha para 17.2; casi todos los iPhone en uso tienen 17 o más
    iOS: "17.0"
  developmentLanguage: es
settings:
  base:
    # Misma versión que el PC y Android (gradle.properties → selah.version)
    MARKETING_VERSION: "2.5.1"
    CURRENT_PROJECT_VERSION: "20502"
    # Escribe aquí tu Team ID de Apple (developer.apple.com → Membership), o elígelo en Xcode
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  SelahRemoto:
    type: application
    platform: iOS
    sources:
      - SelahRemoto
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.selah.remote
        PRODUCT_NAME: SelahRemoto
        TARGETED_DEVICE_FAMILY: "1" # solo iPhone por ahora (iPad exige sus propias capturas y revisión de diseño)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # El framework de Kotlin lo deja aquí la tarea embedAndSignAppleFrameworkForXcode
        FRAMEWORK_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/../remoteUi/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"]
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "SelahRemotoUI"]
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ENABLE_BITCODE: NO
    info:
      path: SelahRemoto/Info.plist
      properties:
        CFBundleDisplayName: Selah Remoto
        CFBundleDevelopmentRegion: es
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIUserInterfaceStyle: Dark
        # Compose Multiplatform: animaciones a 120 Hz en iPhone Pro
        CADisableMinimumFrameDurationOnPhone: true
        # iOS pide permiso para hablar con equipos de la red local (el PC con Selah)
        NSLocalNetworkUsageDescription: "Selah Remoto se conecta al computador de la iglesia que proyecta las canciones y la Biblia, dentro de la misma red Wi-Fi."
        # La conexión con el PC es ws:// / http:// dentro de la red local (no sale a internet)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Sin cifrado propio (solo HTTPS del sistema): evita la pregunta de exportación en cada envío
        ITSAppUsesNonExemptEncryption: false
        # selah://connect?host=…
        CFBundleURLTypes:
          - CFBundleURLName: app.selah.remote
            CFBundleURLSchemes: [selah, proyecta]   # proyecta: PCs con la versión 2.4
    preBuildScripts:
      - name: Compilar Kotlin (remoteUi)
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            echo "Saltando Gradle (vista previa de Xcode)"; exit 0
          fi
          cd "$SRCROOT/.."
          ./gradlew :remoteUi:embedAndSignAppleFrameworkForXcode
